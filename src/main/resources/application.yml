server:
    port: 8888

spring:
    application:
        name: cleanarchitecture

    datasource:
        url: jdbc:h2:file:~/testdb;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password:

    h2:
        console:
            enabled: true

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.H2Dialect

